<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- Navbar -->

    <nav class="navbar">

        <h2>MyShop</h2>

        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/products">Products</a></li>
        </ul>

    </nav>

    <!-- Hero Section -->

    <section class="hero">

        <h1>Welcome To My Ecommerce Store</h1>

        <p>Best Products Available</p>

        <a href="/products">
            <button>Shop Now</button>
        </a>

    </section>

    <!-- Featured Products -->

    <section class="products-section">

        <h1 class="products-title">Featured Products</h1>

        <div class="products-grid">

            {% for product in products %}

            <div class="product-card">

                <img
                    src="{{ url_for('static', filename='images/' + product.image) }}"
                    alt="{{ product.name }}"
                >

                <h3>{{ product.name }}</h3>

                <p>${{ product.price }}</p>

                <a href="/product/{{ product.id }}">
                    <button>View Details</button>
                </a>

            </div>

            {% endfor %}

        </div>

    </section>

    <!-- Footer -->

    <footer class="footer">
        <p>© 2026 MyShop. All Rights Reserved.</p>
    </footer>

</body>
</html>
