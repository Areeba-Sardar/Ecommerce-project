<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<section class="form-section">

    <form class="auth-form" method="POST">

        <h1>Login</h1>

        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">Login</button>

        <p>
            Don't have account?
            <a href="/signup">Signup</a>
        </p>

    </form>

</section>

</body>
</html>
